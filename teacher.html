<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flux Tutor · Study from your notes</title>
<meta name="description" content="Turn your class notes, PDFs, Word documents and photos into a study guide with sources, step-by-step lessons, practice tests, flashcards and a plan to your exam, built only from your own notes.">
<meta name="theme-color" content="#080d18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="public/flux-planner-logo.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Flux Tutor">
<!--
  Flux Tutor: study sets built only from the student's own notes. Plain
  scripts, no app bundles and no account needed: sets are saved in this
  browser (IndexedDB) by flux-tutor-store.js. Flux AI is never called.
-->
<link rel="stylesheet" href="public/css/flux-hub.css?v=6a462093">
<link rel="stylesheet" href="public/css/flux-teacher-app.css?v=3b1825d6">
<script src="public/js/flux-theme-carry.js?v=41b239bd"></script>
<script src="public/js/flux-tutor-theme.js?v=85252ce1"></script>
</head>
<body>
  <header class="top ft-top">
    <img class="brand-mark" src="public/flux-planner-logo.png" alt="Flux" width="32" height="32">
    <span class="brand">Flux Tutor</span>
    <span class="grow"></span>
    <span class="ft-save" id="ftSaveState" hidden></span>
    <button type="button" class="ft-theme-btn" id="ftThemeBtn" aria-label="Switch to light mode" title="Switch to light mode" hidden>
      <svg class="ft-ico-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.3 4.3l1.6 1.6M18.1 18.1l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.3 19.7l1.6-1.6M18.1 5.9l1.6-1.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="ft-ico-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
    <div data-flux-hub="teacher"></div>
  </header>

  <main id="teacherApp" class="ft-main">
    <p class="ft-loading">Opening your study sets…</p>
    <noscript><p class="ft-alert">Flux Tutor needs JavaScript to run.</p></noscript>
  </main>
  <div class="ft-toasts" id="ftToasts"></div>
  <div class="ft-visually-hidden" id="ftLive" aria-live="polite" aria-atomic="true"></div>

  <script src="public/js/flux-hub.js?v=423c00d8"></script>
  <script src="public/js/flux-tutor-core.js?v=5dfa6f83"></script>
  <script src="public/js/flux-tutor-store.js?v=4b4ac9ec"></script>
  <script src="public/js/flux-flash-core.js?v=4b8fcb32"></script>
  <script src="public/js/flux-teacher-app.js?v=ca92d229"></script>
</body>
</html>
