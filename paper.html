<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="public/js/flux-look.js?v=81a3e0d1"></script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://lfigdijuqmbensebnevo.supabase.co; media-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<script src="public/js/flux-sb-config.js?v=0e98cf61"></script>
<script src="public/js/flux-app-visibility.js?v=ade4d827" data-app="paper" data-no-hold></script>
<script defer src="public/js/flux-site-notices.js?v=5e36c924"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flux Graph Paper</title>
<meta name="description" content="Free printable graph paper from Flux: square grid, dot, isometric, semi-log, polar, music staves and handwriting lines, on A4 or Letter, with margins and a title block. Print it or save a PNG.">
<meta name="theme-color" content="#06120e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="public/flux-planner-logo.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Flux Graph Paper">
<!--
  Flux Graph Paper: a free Flux tool, built like periodic.html — no bundles, no
  Supabase, no sign-in, nothing fetched, so it opens offline on any school
  computer. Shared parts: public/js/flux-tool-kit.js, public/css/flux-tools.css.
  Listed in Flux Suite from public/data/products.json.
-->
<link rel="stylesheet" href="public/css/flux-hub.css?v=800c0703">
<link rel="stylesheet" href="public/css/flux-standalone-dark.css?v=806aa2b8">
<link rel="stylesheet" href="public/css/flux-tools.css?v=3c01335d">
<style>
  :root { --bg: #06120e; --accent: #6ee7b7; }
</style>
<script src="public/js/flux-theme-carry.js?v=c2d84cfb"></script>
<script src="public/js/flux-purple-day.js?v=b8cd878a"></script>
<link rel="stylesheet" href="public/css/flux-look-flat.css?v=8156dbe3">
</head>
<body>
  <a href="#main" class="skip-link">Skip to the paper</a>
  <header class="top">
    <a class="ft-back" href="suite.html" aria-label="Back to Flux Suite" title="Back to Flux Suite"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <img class="brand-mark" src="public/flux-planner-logo.png" alt="" width="28" height="28">
    <span class="title">Flux Graph Paper</span>
    <span class="grow"></span>
    <div data-flux-hub="paper"></div>
  </header>
  <main id="main" tabindex="-1">

    <h1 class="ft-h1">Graph paper</h1>
    <p class="ft-lede">Pick a paper, set the spacing, then print it or save a picture.</p>
    <div class="ft-card ft-noprint">
      <div class="ft-row">
        <label class="ft-field">Paper<select id="ppKind">
          <option value="grid">Square grid</option><option value="dot">Dot grid</option><option value="iso">Isometric</option>
          <option value="semilog">Semi-log (3 cycles)</option><option value="polar">Polar</option>
          <option value="staves">Music staves</option><option value="hand">Handwriting lines</option></select></label>
        <label class="ft-field">Size<select id="ppSize"><option value="a4">A4</option><option value="letter">US Letter</option></select></label>
        <label class="ft-field">Spacing (mm)<input id="ppStep" type="number" min="2" max="30" step="1" value="5"></label>
        <label class="ft-field">Margin (mm)<input id="ppMargin" type="number" min="0" max="40" step="1" value="10"></label>
      </div>
      <div class="ft-row">
        <label class="ft-check"><input type="checkbox" id="ppBold" checked> Darker line every 5</label>
        <label class="ft-check"><input type="checkbox" id="ppTitle"> Title block</label>
        <label class="ft-field">Title<input id="ppTitleText" type="text" maxlength="80" placeholder="Name, class, date"></label>
      </div>
      <div class="ft-row" style="margin-top:10px">
        <button type="button" class="ft-btn primary" id="ppPrint">Print</button>
        <button type="button" class="ft-btn" id="ppPng">Save PNG</button>
      </div>
    </div>
    <div class="ft-card" id="ppPreviewWrap" style="background:#fff;padding:10px"><div id="ppPreview" role="img" aria-label="Preview of the graph paper"></div></div>
  </main>
  <script src="public/data/products.js?v=48202a8c"></script>
  <script src="public/js/flux-hub.js?v=eb42b549"></script>
  <script src="public/js/flux-suite-timer.js?v=998cda1e"></script>
  <script src="public/js/flux-tool-kit.js?v=72a95e9f"></script>
  <script src="public/js/flux-app-paper.js?v=e010f2a3"></script>
</body>
</html>
