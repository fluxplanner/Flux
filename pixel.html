<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!--
  GitHub Pages can't send headers, so the CSP rides in a meta tag. A meta CSP
  ignores frame-ancestors; flux-frame-guard.js stays the clickjacking control.
  TODO(csp): 'unsafe-inline' stays until inline <script> blocks and on*= handlers
  move out — worst offenders are index.html (~386 on*= attributes) and the
  inline boot scripts on every standalone page.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.groq.com https://api.anthropic.com https://generativelanguage.googleapis.com https://api.openai.com; frame-src 'self'; form-action 'self'">
<script src="public/js/flux-look.js?v=81a3e0d1"></script>
<script src="public/js/flux-sb-config.js?v=0e98cf61"></script>
<script src="public/js/flux-app-visibility.js?v=ade4d827" data-app="pixel"></script>
<script defer src="public/js/flux-site-notices.js?v=5e36c924"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flux Pixel</title>
<meta name="description" content="Free drawing for school: diagrams, labels, stamps, maths figures and measuring tools, exported as PNG or SVG. No account, no ads.">
<meta name="theme-color" content="#0b0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="public/flux-planner-logo.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Flux Pixel">

<!--
  Flux Pixel: drawing and labelled diagrams on their own page, made the way
  composer.html is — no app bundles and no Supabase, so it opens on any school
  computer without an account. Drawings are kept in this browser.
-->
<link rel="stylesheet" href="public/css/flux-hub.css?v=b6c123db">
<link rel="stylesheet" href="public/css/flux-standalone-dark.css?v=806aa2b8">
<link rel="stylesheet" href="public/css/flux-pixel.css?v=bd05e392">
<style>
  :root { --bg: #0b0d14; --accent: #34d399; } /* the rest: public/css/flux-standalone-dark.css */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background-color: #0b0d14; }
  body {
    min-height: 100dvh;
    /* Its own stacking context, so the fixed glow below paints over the
       body colour and under everything else. */
    isolation: isolate;
    color: var(--text);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 16px; line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  /* The glow is its own fixed layer. As a fixed body background it was
     repainted on every frame of scrolling, which made the page lag. */
  @media screen {
    body::after {
      content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(120% 80% at 50% -10%, rgba(52,211,153,.09), transparent 55%),
      linear-gradient(170deg, #0e1220 0%, #0b0d14 55%, #07080d 100%);
    }
  }
  header.top {
    display: flex; align-items: center; gap: 10px;
    height: calc(52px + env(safe-area-inset-top, 0px));
    padding: env(safe-area-inset-top, 0px) max(clamp(8px, 1.6vw, 14px), env(safe-area-inset-right, 0px)) 0 max(clamp(8px, 1.6vw, 14px), env(safe-area-inset-left, 0px));
    border-bottom: 1px solid var(--border);
    background: #0d1018;
    position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
  .brand-mark { width: 30px; height: 30px; border-radius: 9px; display: block; }
  .title { font-weight: 800; font-size: .95rem; letter-spacing: -.01em; white-space: nowrap; }
  .title small { font-weight: 600; color: var(--muted2); margin-left: 6px; }
  .grow { flex: 1; }
  main { padding: clamp(10px, 2vw, 22px) max(clamp(10px, 2vw, 22px), env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(clamp(10px, 2vw, 22px), env(safe-area-inset-left, 0px)); }
  @media (max-width: 560px) { .title small { display: none; } }
</style>
<script src="public/js/flux-theme-carry.js?v=c2d84cfb"></script>
<script src="public/js/flux-purple-day.js?v=b8cd878a"></script>
<style>/* Off-screen until focused, so keyboard users can jump past the header. */.flux-skip{position:absolute;left:12px;top:-60px;z-index:10000;padding:10px 16px;border-radius:10px;background:#0b0f1a;color:#fff;font:600 14px/1.2 system-ui,sans-serif;text-decoration:none;box-shadow:0 0 0 2px #38bdf8}.flux-skip:focus{top:12px}</style>
<link rel="stylesheet" href="public/css/flux-look-flat.css?v=8156dbe3">
</head>
<body>
<a class="flux-skip" href="#pxHost">Skip to content</a>
  <header class="top">
    <a class="brand" href="#/" aria-label="Flux Pixel: all drawings">
      <img class="brand-mark" src="public/flux-planner-logo.png" alt="" width="30" height="30">
      <span class="title">Flux Pixel<small>Draw and label diagrams</small></span>
    </a>
    <span class="grow"></span>
    <button type="button" class="ftx-btn" data-flux-tool="paper.html" data-flux-tool-title="Graph paper" title="Printable graph paper"><span aria-hidden="true">▦</span><span class="ftx-lbl">Graph paper</span></button>
    <div data-flux-hub="pixel"></div>
  </header>
  <main id="pxHost" class="px-app" aria-label="Flux Pixel"></main>

  <!-- Plain script tags, not the app bundles: this page has to stand alone. -->
  <script src="public/data/products.js?v=02afa9f5"></script>
<script src="public/js/flux-hub.js?v=eb42b549"></script>
<script src="public/js/flux-tool-embed.js?v=aa0e3f08"></script>
<script src="public/js/flux-suite-timer.js?v=998cda1e"></script>
  <script src="public/js/flux-expr.js?v=8f27a6da"></script>
  <script src="public/js/flux-figures.js?v=a8d76ecf"></script>
  <script src="public/js/flux-pixel-stamps.js?v=dc751eaf"></script>
  <script src="public/js/flux-pixel-instruments.js?v=4ae831b7"></script>
  <script src="public/js/flux-pixel.js?v=577ad8b6"></script>
  <script src="public/js/flux-pixel-figures.js?v=cbc15320"></script>
  <script>
    (function () {
      var host = document.getElementById('pxHost');
      if (!window.FluxPixel) {
        host.innerHTML = '<p style="padding:24px;color:#fbbf24">Flux Pixel could not load. Try refreshing.</p>';
        return;
      }
      window.fluxPixelPage = window.FluxPixel.mount(host);
    })();
  </script>
</body>
</html>
