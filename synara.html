<!DOCTYPE html>
<html lang="en" data-host="flux">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Synara — epilepsy care for students</title>
<meta name="description" content="Medication reminders, a seizure log that finds patterns, and an emergency safety card a teacher can follow — for students with epilepsy. Everything stays on this device. No account.">
<meta name="theme-color" content="#f6f5fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121019" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Synara">
<link rel="icon" href="public/synara/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="public/synara/icons/icon-180.png">

<!--
  Synara: medication, seizures and a school safety card for students with
  epilepsy. Its own app with its own look — violet, the epilepsy awareness
  colour, light or dark — so unlike the other standalone pages it does not
  load flux-theme-carry.js. The source lives in the Synara repo and is
  copied to public/synara/ by its `npm run flux`; `npm run build:web` here
  bundles it into the two public/bundles/flux-synara.* files below.
  Data stays in this browser (localStorage "synara.v2").
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="public/css/flux-hub.css?v=e475386e">
<link rel="stylesheet" href="public/bundles/flux-synara.b84fc6d8.css">

<script>
  /* The saved light/dark choice, before first paint: a student who picked
     dark mode must not get a white flash every time this opens. */
  (function () {
    try {
      var saved = JSON.parse(localStorage.getItem('synara.v2') || '{}');
      var theme = saved && saved.settings && saved.settings.theme;
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch (e) { /* storage blocked or corrupt: follow the system */ }
  })();
</script>
</head>
<body>

<a class="skip-link" href="#screen">Skip to content</a>

<div class="app-shell">
  <nav class="tabbar" id="tabbar" aria-label="Main navigation"></nav>
  <div class="shell-main">
    <header class="appbar" id="appbar">
      <!-- Flux's app switcher; Synara moves it into each new app bar. -->
      <div data-flux-hub="synara"></div>
    </header>
    <main class="screen" id="screen" tabindex="-1"></main>
  </div>
</div>

<div class="welcome" id="welcome" role="dialog" aria-modal="true" aria-label="Welcome to Synara" hidden></div>
<div class="backdrop" id="backdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></section>
<div class="emergency" id="emergency" role="dialog" aria-modal="true" aria-label="Emergency seizure card" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="print-card" id="print-card" aria-hidden="true"></div>

<noscript>
  <div style="padding:24px;font-family:system-ui,sans-serif;line-height:1.6">
    <h1>Synara needs JavaScript</h1>
    <p>It keeps everything on this device, which it cannot do with JavaScript turned off.</p>
  </div>
</noscript>

<!-- Plain script tags, not the planner's bundles: this page stands alone. -->
<script src="public/js/flux-hub.js?v=9cfc23d2"></script>
<script src="public/bundles/flux-synara.2102031c.js"></script>
</body>
</html>
