<script src="public/js/flux-sb-config.js?v=0e98cf61"></script>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flux Formulae</title>
<meta name="description" content="Free formula sheets from Flux for physics, chemistry and biology, searchable and typeset, with a working pad that puts your numbers in and solves for the one you leave blank.">

<!--
  Flux Formulae: a free Flux tool, built like periodic.html — no bundles, no
  Supabase, no sign-in, nothing fetched, so it opens offline on any school
  computer. Shared parts: public/js/flux-tool-kit.js, public/css/flux-tools.css.
  Not a Suite app of its own since 2026-11-18: it opens inside the app it
  fits (public/js/flux-tool-embed.js says which), and still works on its own.
-->
<link rel="stylesheet" href="public/css/flux-hub.css?v=b6c123db">
<link rel="stylesheet" href="public/css/flux-standalone-dark.css?v=806aa2b8">
<link rel="stylesheet" href="public/css/flux-tools.css?v=3c01335d">
<link rel="stylesheet" href="public/css/flux-tex.css?v=b68bf637">
<style>
  :root { --bg: #0b0816; --accent: #c4b5fd; }
</style>
<script src="public/js/flux-theme-carry.js?v=c2d84cfb"></script>
<script src="public/js/flux-purple-day.js?v=b8cd878a"></script>
<link rel="stylesheet" href="public/css/flux-look-flat.css?v=8156dbe3">
</head>
<body>
  <a href="#main" class="skip-link">Skip to the formulas</a>
  <header class="top">
    <a class="ft-back" href="suite.html" aria-label="Back to Flux Suite" title="Back to Flux Suite"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <img class="brand-mark" src="public/flux-planner-logo.png" alt="" width="28" height="28">
    <span class="title">Flux Formulae</span>
    <span class="grow"></span>
    <div data-flux-hub="formulae"></div>
  </header>
  <main id="main" tabindex="-1">

    <h1 class="ft-h1">Formulae</h1>
    <p class="ft-lede">Search every sheet. Press “Use” to send a formula to the working pad, fill in what you know, and leave the unknown blank.</p>
    <div class="ft-grid" style="align-items:start">
      <section class="ft-card" aria-labelledby="fmSheetH">
        <h2 id="fmSheetH" class="visually-hidden">Formula sheets</h2>
        <div class="ft-row">
          <label class="ft-field">Search<input id="fmQ" type="search" placeholder="momentum, pH, ideal gas…"></label>
          <label class="ft-field">Subject<select id="fmSub"><option value="">Every subject</option></select></label>
        </div>
        <div id="fmList" style="margin-top:8px"></div>
      </section>
      <section class="ft-card" aria-labelledby="fmPadH" style="position:sticky;top:64px">
        <h2 id="fmPadH">Working pad</h2>
        <label class="ft-field">Equation<input id="fmEq" type="text" spellcheck="false" autocomplete="off" value="v = u + a*t"></label>
        <p class="ft-muted">Write <kbd>*</kbd> for times and <kbd>^</kbd> for powers. Names may have subscripts: <kbd>v_0</kbd>.</p>
        <div id="fmVars" class="ft-row"></div>
        <div class="ft-out" id="fmOut" aria-live="polite"></div>
      </section>
    </div>
  </main>
  <script src="public/data/products.js?v=02afa9f5"></script>
  <script src="public/js/flux-hub.js?v=eb42b549"></script>
  <script src="public/js/flux-suite-timer.js?v=998cda1e"></script>
  <script src="public/js/flux-tool-kit.js?v=91bafb05"></script>
  <script src="public/js/flux-formula-data.js?v=cb3c24b8"></script>
  <script src="public/js/flux-formula-typeset.js?v=4b6135e4"></script>
  <script src="public/js/flux-app-formulae.js?v=fc16f966"></script>
</body>
</html>
