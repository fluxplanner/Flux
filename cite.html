<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="public/js/flux-look.js?v=81a3e0d1"></script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://lfigdijuqmbensebnevo.supabase.co; media-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<script src="public/js/flux-sb-config.js?v=0e98cf61"></script>
<script src="public/js/flux-app-visibility.js?v=ade4d827" data-app="cite" data-no-hold></script>
<script defer src="public/js/flux-site-notices.js?v=5e36c924"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flux Cite</title>
<meta name="description" content="Free citation maker from Flux: MLA 9, APA 7, Chicago and Harvard for websites, books and journal articles, in-text citations, and a bibliography you can copy or export as BibTeX or text. Nothing leaves your device.">
<meta name="theme-color" content="#141006">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="public/flux-planner-logo.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Flux Cite">
<!--
  Flux Cite: a free Flux tool, built like periodic.html — no bundles, no
  Supabase, no sign-in, nothing fetched, so it opens offline on any school
  computer. Shared parts: public/js/flux-tool-kit.js, public/css/flux-tools.css.
  Listed in Flux Suite from public/data/products.json.
-->
<link rel="stylesheet" href="public/css/flux-hub.css?v=4eeb98c7">
<link rel="stylesheet" href="public/css/flux-standalone-dark.css?v=806aa2b8">
<link rel="stylesheet" href="public/css/flux-tools.css?v=3c01335d">
<style>
  :root { --bg: #141006; --accent: #fde68a; }
</style>
<script src="public/js/flux-theme-carry.js?v=c2d84cfb"></script>
<script src="public/js/flux-purple-day.js?v=b8cd878a"></script>
<link rel="stylesheet" href="public/css/flux-look-flat.css?v=8156dbe3">
</head>
<body>
  <a href="#main" class="skip-link">Skip to the citation maker</a>
  <header class="top">
    <a class="ft-back" href="suite.html" aria-label="Back to Flux Suite" title="Back to Flux Suite"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <img class="brand-mark" src="public/flux-planner-logo.png" alt="" width="28" height="28">
    <span class="title">Flux Cite</span>
    <span class="grow"></span>
    <div data-flux-hub="cite"></div>
  </header>
  <main id="main" tabindex="-1">

    <h1 class="ft-h1">Citations</h1>
    <p class="ft-lede">Fill in what you know about a source. Paste a DOI, ISBN or web address into “Quick fill” to sort it into the right box.</p>
    <div class="ft-grid">
      <form class="ft-card" id="ciForm" novalidate>
        <h2>Source</h2>
        <div class="ft-row">
          <label class="ft-field">Quick fill<input id="ciQuick" type="text" placeholder="10.1000/xyz123, 978-0-14-312755-0 or https://…"></label>
        </div>
        <div class="ft-row">
          <label class="ft-field">Type<select id="ciType"><option value="web">Website</option><option value="book">Book</option><option value="journal">Journal article</option></select></label>
          <label class="ft-field">Style<select id="ciStyle"><option value="mla">MLA 9</option><option value="apa">APA 7</option><option value="chicago">Chicago</option><option value="harvard">Harvard</option></select></label>
        </div>
        <label class="ft-field">Authors, one per line (Last, First)<textarea id="ciAuthors" class="ft-in" rows="3" style="min-height:76px"></textarea></label>
        <div class="ft-row">
          <label class="ft-field">Title<input id="ciTitle" type="text"></label>
          <label class="ft-field" data-for="web journal">Website or journal<input id="ciContainer" type="text"></label>
          <label class="ft-field" data-for="web book">Publisher<input id="ciPublisher" type="text"></label>
        </div>
        <div class="ft-row">
          <label class="ft-field">Year<input id="ciYear" type="text" inputmode="numeric" maxlength="4"></label>
          <label class="ft-field" data-for="web">Month and day<input id="ciDate" type="text" placeholder="12 March"></label>
          <label class="ft-field" data-for="journal">Volume<input id="ciVol" type="text"></label>
          <label class="ft-field" data-for="journal">Issue<input id="ciIssue" type="text"></label>
          <label class="ft-field" data-for="journal book">Pages<input id="ciPages" type="text" placeholder="12–19"></label>
        </div>
        <div class="ft-row">
          <label class="ft-field" data-for="web journal">URL<input id="ciUrl" type="url"></label>
          <label class="ft-field" data-for="journal">DOI<input id="ciDoi" type="text"></label>
          <label class="ft-field" data-for="book">ISBN<input id="ciIsbn" type="text"></label>
          <label class="ft-field" data-for="web">Accessed<input id="ciAccessed" type="date"></label>
        </div>
        <div class="ft-row" style="margin-top:10px">
          <button type="submit" class="ft-btn primary">Add to bibliography</button>
          <button type="button" class="ft-btn" id="ciClear">Clear</button>
        </div>
      </form>
      <section class="ft-card" aria-labelledby="ciPrevH">
        <h2 id="ciPrevH">Preview</h2>
        <p id="ciPreview" class="ft-out" style="display:block"></p>
        <p><strong>In-text:</strong> <span id="ciIntext"></span></p>
        <div class="ft-row"><button type="button" class="ft-btn small" id="ciCopyOne">Copy citation</button><button type="button" class="ft-btn small" id="ciCopyIn">Copy in-text</button></div>
      </section>
    </div>
    <section class="ft-card" aria-labelledby="ciListH">
      <h2 id="ciListH">Bibliography <span class="ft-muted" id="ciCount"></span></h2>
      <ol class="ft-list" id="ciList"></ol>
      <div class="ft-row" style="margin-top:10px">
        <button type="button" class="ft-btn" id="ciCopyAll">Copy all</button>
        <button type="button" class="ft-btn" id="ciTxt">Export text</button>
        <button type="button" class="ft-btn" id="ciBib">Export BibTeX</button>
      </div>
    </section>
  </main>
  <script src="public/data/products.js?v=94acbfbd"></script>
  <script src="public/js/flux-hub.js?v=eb42b549"></script>
  <script src="public/js/flux-suite-timer.js?v=998cda1e"></script>
  <script src="public/js/flux-tool-kit.js?v=fc5bc211"></script>
  <script src="public/js/flux-app-cite.js?v=e677961a"></script>
</body>
</html>
