<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flux Translate</title>
<meta name="description" content="Free translation between 35 languages, with read-aloud and recent translations. In Chrome it translates on your device, so your text stays on your computer.">
<meta name="theme-color" content="#0c0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="public/flux-planner-logo.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Flux Translate">

<!--
  Flux Translate: made the way flashcards.html is — no app bundles and no
  Supabase library, so it opens on any school computer without an account.
-->
<link rel="stylesheet" href="public/css/flux-hub.css?v=6a462093">
<link rel="stylesheet" href="public/css/flux-standalone-dark.css?v=806aa2b8">
<style>
  :root { --bg: #0c0a14; --accent: #2dd4bf; } /* the rest: public/css/flux-standalone-dark.css */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background-color: #0c0a14; }
  body {
    min-height: 100dvh;
    isolation: isolate;
    color: var(--text);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 16px; line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  @media screen {
    body::after {
      content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(120% 80% at 50% -10%, rgba(45,212,191,.10), transparent 55%),
      radial-gradient(90% 70% at 100% 5%, rgba(124,92,255,.08), transparent 55%),
      linear-gradient(170deg, #0f0c1a 0%, #0c0a14 55%, #07060d 100%);
    }
  }
  header.top {
    display: flex; align-items: center; gap: 10px;
    height: calc(52px + env(safe-area-inset-top, 0px));
    padding: env(safe-area-inset-top, 0px) max(clamp(8px, 1.6vw, 14px), env(safe-area-inset-right, 0px)) 0 max(clamp(8px, 1.6vw, 14px), env(safe-area-inset-left, 0px));
    border-bottom: 1px solid var(--border);
    background: #0e0b17;
    position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
  .brand-mark { width: 30px; height: 30px; border-radius: 9px; display: block; }
  .title { font-weight: 800; font-size: .95rem; letter-spacing: -.01em; white-space: nowrap; }
  .title small { font-weight: 600; color: var(--muted2); margin-left: 6px; }
  .grow { flex: 1; }
  main {
    max-width: 1100px; margin: 0 auto;
    padding: clamp(14px, 2.6vw, 28px) max(16px, env(safe-area-inset-right, 0px)) calc(56px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  @media (max-width: 560px) { .title small { display: none; } }

  .ft-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .ft-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .ft-lang { flex: 1; min-width: 0; }
  .ft-lang select {
    width: 100%; min-height: 44px; padding: 0 12px; border-radius: 12px;
    background: rgba(255,255,255,.05); color: var(--text); border: 1px solid var(--border);
    font: inherit; font-weight: 700;
  }
  .ft-lang select option { background: #14111f; color: #f4f2fb; }
  .ft-swap {
    width: 44px; height: 44px; flex: none; border-radius: 50%; cursor: pointer;
    border: 1px solid var(--border); background: rgba(45,212,191,.12); color: var(--accent);
    font-size: 1.2rem; transition: transform .25s ease;
  }
  .ft-swap:hover { transform: rotate(180deg); }
  .ft-panes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .ft-panes { grid-template-columns: 1fr; } }
  .ft-pane {
    display: flex; flex-direction: column; min-height: 260px;
    border: 1px solid var(--border); border-radius: 16px; background: rgba(255,255,255,.035); overflow: hidden;
  }
  .ft-pane--out { background: rgba(45,212,191,.05); }
  .ft-pane textarea, .ft-out {
    flex: 1; width: 100%; padding: 16px; border: 0; resize: vertical; min-height: 200px;
    background: transparent; color: var(--text); font: inherit; font-size: 1.1rem; line-height: 1.55;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .ft-pane textarea:focus { outline: none; }
  .ft-pane:focus-within { border-color: var(--accent); }
  .ft-hint { color: var(--muted2); }
  .ft-foot { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); }
  .ft-count, .ft-how { font-size: .8rem; color: var(--muted2); }
  .ft-btn {
    min-height: 40px; padding: 0 16px; border-radius: 999px; cursor: pointer;
    font: inherit; font-weight: 700; font-size: .9rem;
    border: 1px solid var(--border); background: rgba(255,255,255,.05); color: var(--text);
  }
  .ft-btn:disabled { opacity: .45; cursor: default; }
  .ft-go { background: var(--accent); color: #062421; border-color: transparent; }
  .ft-tip { font-size: .85rem; color: var(--muted2); margin: 14px 2px; }
  .ft-history-head { display: flex; align-items: center; justify-content: space-between; margin: 22px 2px 10px; }
  .ft-history-head h2 { font-size: 1rem; margin: 0; }
  .ft-item {
    display: grid; gap: 2px; width: 100%; text-align: left; cursor: pointer; margin-bottom: 8px;
    padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border);
    background: rgba(255,255,255,.03); color: var(--text); font: inherit;
  }
  .ft-item:hover { border-color: var(--accent); }
  .ft-item-langs { font-size: .75rem; font-weight: 800; color: var(--accent); }
  .ft-item-src { color: var(--muted2); font-size: .9rem; }
  @media (prefers-reduced-motion: reduce) { .ft-swap { transition: none; } }
</style>
<script src="public/js/flux-theme-carry.js?v=41b239bd"></script>
<script src="public/js/flux-purple-day.js?v=1966eb3d"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="translate.html" aria-label="Flux Translate">
      <img class="brand-mark" src="public/flux-planner-logo.png" alt="" width="30" height="30">
      <span class="title">Flux Translate<small>35 languages, free</small></span>
    </a>
    <span class="grow"></span>
    <div data-flux-hub="translate"></div>
  </header>
  <main id="ftHost" aria-label="Flux Translate"></main>

  <!-- Plain script tags, not the app bundles: this page has to stand alone. -->
  <script src="public/js/flux-hub.js?v=fcee7925"></script>
  <script src="public/js/flux-translator.js?v=da90d5ac"></script>
  <script>
    (function () {
      var host = document.getElementById('ftHost');
      if (!window.FluxTranslator) {
        host.innerHTML = '<p style="padding:24px;color:#fbbf24">Flux Translate could not load. Try refreshing.</p>';
        return;
      }
      window.fluxTranslatePage = window.FluxTranslator.mount(host);
    })();
  </script>
</body>
</html>
