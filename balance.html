  Listed in Flux Suite from public/data/products.json.
-->

</style>

<body>
  <a href="#main" class="skip-link">Skip to the balancer</a>
  <header class="top">
    <a class="ft-back" href="suite.html" aria-label="Back to Flux Suite" title="Back to Flux Suite"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <img class="brand-mark" src="public/flux-planner-logo.png" alt="" width="28" height="28">
    <span class="title">Flux Balance</span>
    <span class="grow"></span>
    <div data-flux-hub="balance"></div>
  </header>
  <main id="main" tabindex="-1">

    <h1 class="ft-h1">Balance</h1>
    <p class="ft-lede">Equations, molar mass, formulas from percentages, and the limiting reagent — with the working.</p>
    <div class="ft-tabs" role="tablist" aria-label="Chemistry tools"><button type="button" role="tab" class="ft-tab" id="tab-eq" aria-controls="pane-eq">Balance</button><button type="button" role="tab" class="ft-tab" id="tab-mm" aria-controls="pane-mm">Molar mass</button><button type="button" role="tab" class="ft-tab" id="tab-emp" aria-controls="pane-emp">Empirical formula</button><button type="button" role="tab" class="ft-tab" id="tab-lim" aria-controls="pane-lim">Limiting reagent</button></div>
    <section class="ft-card" id="pane-eq" role="tabpanel" aria-labelledby="tab-eq">
      <form id="eqForm" class="ft-row" novalidate>
        <label class="ft-field" style="flex:4 1 260px">Equation<input id="eqIn" type="text" autocomplete="off" spellcheck="false" value="Fe + O2 -> Fe2O3"></label>
        <button type="submit" class="ft-btn primary">Balance</button>
      </form>
      <p class="ft-muted">Use <kbd>-&gt;</kbd> for the arrow. Charges: <kbd>Fe^3+</kbd>, <kbd>MnO4^-</kbd>; electrons: <kbd>e-</kbd>; hydrates: <kbd>CuSO4.5H2O</kbd>.</p>
      <div class="ft-out" id="eqOut" aria-live="polite"></div>
    </section>
    <section class="ft-card" id="pane-mm" role="tabpanel" aria-labelledby="tab-mm">
      <form id="mmForm" class="ft-row" novalidate>
        <label class="ft-field" style="flex:3 1 220px">Formula<input id="mmIn" type="text" autocomplete="off" spellcheck="false" value="Ca(OH)2"></label>
        <button type="submit" class="ft-btn primary">Work it out</button>
      </form>
      <div class="ft-out" id="mmOut" aria-live="polite"></div>
    </section>
    <section class="ft-card" id="pane-emp" role="tabpanel" aria-labelledby="tab-emp">
      <form id="empForm" novalidate>
        <label class="ft-field">Element and mass or % on each line<textarea id="empIn" class="ft-in" rows="4" style="min-height:96px">C 40.0
H 6.7
O 53.3</textarea></label>
        <div class="ft-row"><label class="ft-field">Molar mass, if known (g/mol)<input id="empM" type="text" inputmode="decimal" placeholder="180"></label>
        <button type="submit" class="ft-btn primary">Find the formula</button></div>
      </form>
      <div class="ft-out" id="empOut" aria-live="polite"></div>
    </section>
    <section class="ft-card" id="pane-lim" role="tabpanel" aria-labelledby="tab-lim">
      <form id="limForm" novalidate>
        <div class="ft-row"><label class="ft-field" style="flex:4 1 260px">Equation<input id="limIn" type="text" autocomplete="off" spellcheck="false" value="N2 + H2 -> NH3"></label>
        <button type="button" class="ft-btn" id="limLoad">Use this equation</button></div>
        <div id="limMasses" class="ft-row"></div>
        <button type="submit" class="ft-btn primary" style="margin-top:10px">Find the limiting reagent</button>
      </form>
      <div class="ft-out" id="limOut" aria-live="polite"></div>
    </section>
  </main>
  <script src="public/data/products.js?v=48202a8c"></script>

  <script src="public/js/flux-chem.js?v=07de6a14"></script>
  <script src="public/js/flux-app-balance.js?v=59df5593"></script>
</body>
</html>
