<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flux Composer</title>
<meta name="description" content="A free music theory studio from Flux: a table of every key, a playable keyboard that writes what you play, scales and modes, chords and inversions, cadences, an ear trainer, a metronome, a beat maker, the orchestra, a glossary and IB DP Music. No account needed.">
<meta name="theme-color" content="#0a0816">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="public/flux-planner-logo.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Flux Composer">

<!--
  Flux Composer: the music tools as their own page, made the way periodic.html
  is — no app bundles and no Supabase, only its own scripts, so it opens on any
  school computer without an account. The planner's Study tools ▸ Arts ▸ Music
  links here.
-->
<link rel="stylesheet" href="public/css/flux-hub.css?v=6a462093">
<link rel="stylesheet" href="public/css/flux-composer.css?v=26f4077e">
<style>
  :root { --bg: #0a0816; --text: #eaf1ff; --muted2: #9fb0cc; --accent: #a78bfa; --border: rgba(255,255,255,.07); --border2: rgba(255,255,255,.14); --card: rgba(18,25,42,.78); --card2: rgba(28,36,58,.8); }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background-color: #0a0816; }
  body {
    min-height: 100dvh;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(167,139,250,.12), transparent 55%),
      radial-gradient(90% 70% at 100% 5%, rgba(0,194,255,.07), transparent 55%),
      linear-gradient(170deg, #0d0a1d 0%, #0a0816 55%, #06050f 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 16px; line-height: 1.5;
  }
  header.top {
    display: flex; align-items: center; gap: 10px;
    height: calc(52px + env(safe-area-inset-top, 0px));
    padding: env(safe-area-inset-top, 0px) max(clamp(8px, 1.6vw, 14px), env(safe-area-inset-right, 0px)) 0 max(clamp(8px, 1.6vw, 14px), env(safe-area-inset-left, 0px));
    border-bottom: 1px solid var(--border);
    background: #0b0918;
    position: sticky; top: 0; z-index: 20;
  }
  .brand-mark { width: 30px; height: 30px; border-radius: 9px; display: block; }
  .title { font-weight: 800; font-size: .95rem; letter-spacing: -.01em; white-space: nowrap; }
  .title small { font-weight: 600; color: var(--muted2); margin-left: 6px; }
  .grow { flex: 1; }
  .hbtn { display: grid; place-items: center; width: 36px; height: 36px; padding: 0; margin: 0; border: 0; border-radius: 10px; background: none; color: var(--muted2); cursor: pointer; }
  .hbtn:hover { color: var(--text); background: rgba(255,255,255,.06); }
  .hbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  main {
    padding: clamp(12px, 2.4vw, 26px) max(clamp(10px, 2.4vw, 28px), env(safe-area-inset-right, 0px)) calc(48px + env(safe-area-inset-bottom, 0px)) max(clamp(10px, 2.4vw, 28px), env(safe-area-inset-left, 0px));
    max-width: 1500px; margin: 0 auto;
  }
  @media (max-width: 560px) { .title small { display: none; } }
</style>
<script src="public/js/flux-theme-carry.js?v=be761bf0"></script>
<script src="public/js/flux-purple-day.js?v=1966eb3d"></script>
</head>
<body>
  <header class="top">
    <img class="brand-mark" src="public/flux-planner-logo.png" alt="Flux" width="30" height="30">
    <span class="title">Flux Composer<small>Music theory studio</small></span>
    <span class="grow"></span>
    <button type="button" class="hbtn" id="fcShare" title="Copy a link to what you are looking at" aria-label="Share">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
    </button>
    <div data-flux-hub="composer"></div>
  </header>

  <main id="fcHost" aria-label="Flux Composer"></main>

  <!-- Plain script tags, not the app bundles: this page has to stand alone. -->
  <script src="public/js/flux-hub.js?v=423c00d8"></script>
  <script src="public/js/flux-music-theory.js?v=f272dfc4"></script>
  <script src="public/js/flux-composer.js?v=fe4b6995"></script>
  <script>
    (function () {
      var host = document.getElementById('fcHost');
      if (!window.FluxComposer || !window.FluxMusicTheory) {
        host.innerHTML = '<p style="padding:24px;color:#fbbf24">Flux Composer could not load. Try refreshing.</p>';
        return;
      }
      var app = window.FluxComposer.mount(host, { hash: true });
      window.addEventListener('hashchange', function () { if (app) app.readHash(); });
      document.getElementById('fcShare').addEventListener('click', function () {
        var url = location.href;
        var toast = function (text) {
          var t = document.createElement('div'); t.className = 'fc-toast'; t.textContent = text;
          document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2000);
        };
        if (navigator.share && window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
          navigator.share({ title: 'Flux Composer', url: url }).catch(function () {});
          return;
        }
        try { navigator.clipboard.writeText(url).then(function () { toast('Link copied'); }, function () { window.prompt('Copy this link:', url); }); }
        catch (e) { window.prompt('Copy this link:', url); }
      });
      window.fluxComposerPage = { get instance() { return app; } };
    })();
  </script>
</body>
</html>
