<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>Flux</title>
<link rel="icon" type="image/png" href="../public/flux-planner-logo.png">
<style>
  :root { --bg: #f4f5f8; --card: #fff; --line: #e2e5ec; --text: #161b26; --muted: #667085; --accent: #5b5bf0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --card: #161b24; --line: #262d3a; --text: #e8ebf2; --muted: #8b94a7; --accent: #7b7bff; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; padding: 16px; box-sizing: border-box; }
  main { width: min(440px, 100%); }
  h1 { font-size: 22px; display: flex; align-items: center; gap: 10px; margin: 0 0 18px; }
  h1 img { width: 32px; height: 32px; border-radius: 8px; }
  a.site { display: block; padding: 16px 18px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; color: var(--text); text-decoration: none; margin-bottom: 10px; }
  a.site:hover { border-color: var(--accent); }
  a.site b { color: var(--accent); }
  a.site span { display: block; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1><img src="../public/flux-planner-logo.png" alt="">Flux</h1>
  <a class="site" href="chess/"><b>Flux Chess</b><span>Bots, Lichess play and Stockfish game review.</span></a>
</main>
</body>
</html>
