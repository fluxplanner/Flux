<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flux Grapher</title>
<meta name="description" content="Free graphing from Flux: functions like Desmos, and lab data with uncertainty columns, error bars and a best-fit gradient with its uncertainty. No account needed.">
<meta name="theme-color" content="#070b14">
<link rel="icon" type="image/png" href="public/flux-planner-logo.png">

<!--
  The standalone grapher.

  Deliberately NOT part of the planner app: no bundles and no supabase
  library. Someone should be able to open this on a school computer, plot a
  practical, take the image and leave — without an account and without paying
  anyone. Signing in exists only for saving, and is a plain fetch in
  flux-grapher-cloud.js.

  Because it loads none of the app's CSS, the palette is defined here. The
  grapher's own classes come from flux-grapher.css, shared with the version
  inside the planner so both look the same.
-->
<link rel="stylesheet" href="public/css/flux-tex.css?v=b68bf637">
<link rel="stylesheet" href="public/css/flux-grapher.css?v=f841c416">
<link rel="stylesheet" href="public/css/flux-hub.css?v=6a625201">
<style>
  :root {
    --bg: #070b14;
    --text: #eaf1ff;
    --muted2: #9fb0cc;
    --accent: #00c2ff;
    --border: rgba(255,255,255,.07);
    --border2: rgba(255,255,255,.14);
    --card: rgba(18,25,42,.78);
    --card2: rgba(28,36,58,.8);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(0,194,255,.10), transparent 55%),
      radial-gradient(90% 70% at 100% 5%, rgba(124,92,255,.08), transparent 55%),
      linear-gradient(170deg, #0a0f1c 0%, #070b14 55%, #05070f 100%);
    color: var(--text);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  /* The graph gets the screen. The only chrome is one thin bar: the mark, the
     switch between the two graphers, and a row of icons. The page itself
     never scrolls — the rail scrolls inside the tool — so the plot cannot be
     pushed off the bottom by a growing table. */
  .wrap { height: 100dvh; display: flex; flex-direction: column; }

  header.top {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 0 0 auto;
    height: 52px;
    padding: 0 clamp(8px, 1.6vw, 14px);
    border-bottom: 1px solid var(--border);
    background: rgba(8, 12, 22, .78);
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    position: relative;
    z-index: 5;
  }
  .brand { display: flex; align-items: center; flex: 0 0 auto; }
  /* Just the mark — the one piece of branding that stays. */
  .brand-mark { width: 30px; height: 30px; border-radius: 9px; display: block; }

  .modes {
    display: inline-flex; gap: 3px; padding: 3px;
    background: rgba(10,14,24,.6); border: 1px solid var(--border);
    border-radius: 11px;
  }
  .mode-btn {
    appearance: none; border: 0; cursor: pointer;
    font: inherit; font-size: .8rem; font-weight: 700; letter-spacing: -.01em;
    padding: 7px 14px; border-radius: 9px;
    color: var(--muted2); background: transparent;
    transition: color .16s ease, background .16s ease;
  }
  .mode-btn:hover { color: var(--text); }
  .mode-btn[aria-selected="true"] { color: #062030; background: linear-gradient(135deg, #7fe3ff, #00c2ff); }
  /* Once flux-grapher.js adds the sliding highlight, it paints the chosen tab
     and the buttons go clear so the colour can travel between them. */
  .modes.has-glide { position: relative; }
  .modes.has-glide .mode-btn { position: relative; z-index: 1; background: transparent; transition: color .28s ease; }
  .modes .flg-glide { border-radius: 9px; }
  .mode-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .grow { flex: 1; }
  .acts { display: flex; align-items: center; gap: 2px; }
  .hbtn {
    position: relative;
    display: grid; place-items: center;
    width: 36px; height: 36px;
    padding: 0; margin: 0;
    border: 0; border-radius: 10px;
    background: none;
    color: var(--muted2);
    cursor: pointer;
    transition: color .15s ease, background .15s ease;
  }
  .hbtn:hover { color: var(--text); background: rgba(255,255,255,.06); }
  .hbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* Unsaved work: a small dot on the save button, never a banner. */
  .hbtn.is-dirty::after {
    content: ''; position: absolute; top: 7px; right: 7px;
    width: 7px; height: 7px; border-radius: 50%;
    background: #fbbf24; box-shadow: 0 0 0 2px #0a0f1c;
  }
  .hbtn .qm { font-weight: 800; font-size: .95rem; }
  .acct-av {
    display: grid; place-items: center;
    width: 26px; height: 26px; border-radius: 50%;
    font-size: .74rem; font-weight: 800;
    color: #04121c; background: linear-gradient(135deg, #7fe3ff, #a78bfa);
  }
  .sep { width: 1px; height: 22px; background: var(--border2); margin: 0 6px; }

  main#grapherHost { flex: 1 1 auto; min-height: 0; position: relative; }

  .mode-btn .ms { display: none; }
  @media (max-width: 560px) {
    /* A phone cannot fit "Measurements" and the hub on one bar; the short
       labels keep every control reachable instead of pushing the hub off. */
    header.top { gap: 6px; }
    .mode-btn { padding: 7px 10px; font-size: .76rem; }
    .mode-btn .ml { display: none; }
    .mode-btn .ms { display: inline; }
    .hbtn { width: 32px; height: 32px; }
    .sep, #ghHelp, #ghPng, .fxhub-btn-label { display: none; }
    .fxhub-btn { padding: 7px 9px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <!-- The mark does not navigate. Switching apps is the hub's job, and a
           logo that means "leave" is the most likely thing to be clicked. -->
      <span class="brand" title="Flux">
        <img class="brand-mark" src="public/flux-planner-logo.png" alt="Flux" width="30" height="30">
      </span>

      <div class="modes" id="ghModes" role="tablist" aria-label="Which grapher">
        <button type="button" class="mode-btn" id="modeFunctions" role="tab"
          aria-selected="false" aria-controls="grapherHost"><span class="ml">Functions</span><span class="ms" aria-hidden="true">ƒ(x)</span></button>
        <button type="button" class="mode-btn" id="modeData" role="tab"
          aria-selected="true" aria-controls="grapherHost"><span class="ml">Measurements</span><span class="ms" aria-hidden="true">Data ±</span></button>
      </div>

      <span class="grow"></span>

      <div class="acts">
        <button type="button" class="hbtn" id="ghSave" title="Save (Ctrl+S)" aria-label="Save to your Flux account">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.8A6 6 0 0 0 4.3 12 3.5 3.5 0 0 0 6.5 19z"/><path d="M12 12v6M9.5 14.5 12 12l2.5 2.5"/></svg>
        </button>
        <button type="button" class="hbtn" id="ghOpen" title="Your saved graphs" aria-label="Your saved graphs">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </button>
        <button type="button" class="hbtn" id="ghPng" title="Download as an image" aria-label="Download as an image">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
        </button>
        <button type="button" class="hbtn" id="ghShare" title="Copy a link to the grapher" aria-label="Share the grapher">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
        </button>
        <button type="button" class="hbtn" id="ghHelp" title="Tour" aria-label="Take the tour"><span class="qm" aria-hidden="true">?</span></button>
        <span class="sep" aria-hidden="true"></span>
        <button type="button" class="hbtn" id="ghAcct" title="Account" aria-label="Account">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        </button>
      </div>

      <div data-flux-hub="grapher"></div>
    </header>

    <main id="grapherHost" aria-label="Graphing tool"></main>
  </div>

  <!-- Plain script tags, not the app bundles: this page has to stand alone. -->
  <script src="public/js/flux-hub.js?v=82666615"></script>
  <script src="public/js/flux-expr.js?v=422f7a09"></script>
  <script src="public/js/flux-lab-fit.js?v=d1991389"></script>
  <script src="public/js/flux-formula-typeset.js?v=4b6135e4"></script>
  <script src="public/js/flux-grapher.js?v=c5a790d3"></script>
  <script src="public/js/flux-grapher-cloud.js?v=1402f249"></script>
  <script src="public/js/flux-grapher-tour.js?v=b3eac452"></script>
  <script>
    (function () {
      var host = document.getElementById('grapherHost');
      var G = window.FluxGrapher, C = window.FluxGraphCloud, T = window.FluxGrapherTour;
      if (!host) return;
      if (!G) {
        host.innerHTML = '<p style="padding:24px;color:#fbbf24">The graphing tool could not load. Try refreshing.</p>';
        return;
      }

      var btnFn = document.getElementById('modeFunctions');
      var btnData = document.getElementById('modeData');
      var saveBtn = document.getElementById('ghSave');
      var acctBtn = document.getElementById('ghAcct');
      var inst = null;
      /* Each half keeps its graph while you look at the other. Nothing here is
         written to storage — switching away must not lose work, and closing
         the tab without saving is allowed to. */
      var stash = {};

      function markDirty() { saveBtn.classList.toggle('is-dirty', !!(inst && inst.isDirty())); }

      function show(mode) {
        var prev = inst ? inst.kind : null;
        if (inst) { stash[inst.kind] = inst.snapshot(); inst.destroy(); }
        inst = G.create(host, { mode: mode, surface: 'standalone' });
        if (stash[mode]) inst.restore(stash[mode]);
        inst.on('change', markDirty);
        inst.on('saved', markDirty);
        btnFn.setAttribute('aria-selected', String(mode === 'functions'));
        btnData.setAttribute('aria-selected', String(mode !== 'functions'));
        // The highlight slides to the chosen tab and the new grapher comes in
        // from that side (Functions left, Measurements right).
        if (G.glideSeg) G.glideSeg(document.getElementById('ghModes'), mode === 'functions' ? btnFn : btnData, !prev);
        if (G.enterFrom) G.enterFrom(host.firstElementChild, mode, prev);
        try { localStorage.setItem(G.MODE_KEY, mode); } catch (e) {}
        markDirty();
      }

      btnFn.addEventListener('click', function () { if (inst.kind !== 'functions') show('functions'); });
      btnData.addEventListener('click', function () { if (inst.kind !== 'data') show('data'); });

      /* Opened from the planner's full-screen button: take its graph along.
         Read once and removed, and ignored if it is stale. */
      var hand = null;
      try {
        hand = JSON.parse(localStorage.getItem(G.HANDOFF_KEY) || 'null');
        localStorage.removeItem(G.HANDOFF_KEY);
      } catch (e) {}
      if (hand && !(hand.at && Date.now() - hand.at < 10 * 60 * 1000)) hand = null;

      var saved = 'data';
      try { saved = localStorage.getItem(G.MODE_KEY) || 'data'; } catch (e) {}
      show(hand ? (hand.kind === 'functions' ? 'functions' : 'data') : (saved === 'functions' ? 'functions' : 'data'));
      if (hand) inst.loadDoc(hand.payload, hand.cloud);

      /* Deleted in the planner (or another tab) while it is open here: let go
         of the saved id, so saving does not quietly bring it back. */
      if (C && C.onDeleted) C.onDeleted(function (id, title) {
        if (inst) inst.forgetCloud(id, title);
        Object.keys(stash).forEach(function (k) { if (stash[k] && stash[k].cloud && stash[k].cloud.id === id) stash[k].cloud = null; });
        markDirty();
      });

      function anyDirty() {
        if (inst && inst.isDirty()) return true;
        return Object.keys(stash).some(function (k) { return k !== inst.kind && stash[k] && stash[k].dirty; });
      }

      function save() {
        if (!C) return;
        C.save(inst).then(markDirty);
      }
      saveBtn.addEventListener('click', save);
      document.getElementById('ghOpen').addEventListener('click', function () {
        if (!C) return;
        C.open(function (row) {
          if (inst.isDirty() && !window.confirm('Open "' + row.title + '"? Unsaved changes to the graph on screen will be lost.')) return;
          if (row.kind !== inst.kind) { delete stash[row.kind]; show(row.kind); }
          inst.loadDoc(row.payload, { id: row.id, title: row.title });
          markDirty();
          G.toast('Opened "' + row.title + '".', 'success');
        });
      });
      document.getElementById('ghPng').addEventListener('click', function () { inst.exportPNG(); });
      document.getElementById('ghHelp').addEventListener('click', function () { if (T) T.start(); });

      /* The short link, not this page's own address: /graph/ is the one
         worth putting on a slide or in a class chat. */
      document.getElementById('ghShare').addEventListener('click', function () {
        var url = new URL('graph/', location.href.replace(/[^/]*([?#].*)?$/, '')).href;
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        if (coarse && navigator.share) {
          navigator.share({ title: 'Flux Grapher', text: 'Free graphing — no account needed', url: url }).catch(function () {});
          return;
        }
        var done = function () { G.toast('Link copied — ' + url.replace(/^https?:\/\//, ''), 'success'); };
        try {
          navigator.clipboard.writeText(url).then(done, function () { window.prompt('Copy this link:', url); });
        } catch (e) { window.prompt('Copy this link:', url); }
      });
      acctBtn.addEventListener('click', function () { if (C) C.accountMenu(acctBtn); });

      document.addEventListener('keydown', function (e) {
        if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && e.key && e.key.toLowerCase() === 's') {
          e.preventDefault();
          save();
        }
      });

      // The account button wears your initial once signed in.
      var ACCT_ICON = acctBtn.innerHTML;
      function paintAccount() {
        if (!C) return;
        C.session().then(function (s) {
          if (!s) { acctBtn.innerHTML = ACCT_ICON; acctBtn.title = 'Sign in'; return; }
          var name = C.displayName(s.user) || '?';
          acctBtn.innerHTML = '<span class="acct-av">' + G.esc(name.charAt(0).toUpperCase()) + '</span>';
          acctBtn.title = name;
        });
      }
      if (C) C.onAccount(paintAccount);
      paintAccount();

      window.addEventListener('beforeunload', function (e) {
        if (!anyDirty()) return;
        e.preventDefault();
        e.returnValue = '';
      });

      // First visit: offer the tour, once, and only after the tool has drawn.
      if (T) setTimeout(T.offer, 900);

      window.fluxGrapherPage = { get instance() { return inst; }, show: show };
    })();
  </script>
</body>
</html>
