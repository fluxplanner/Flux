<script src="public/js/flux-sb-config.js?v=0e98cf61"></script>
<script src="public/js/flux-app-visibility.js?v=ade4d827" data-app="spell" data-no-hold></script>
<script defer src="public/js/flux-site-notices.js?v=5e36c924"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flux Spell</title>
<meta name="description" content="Free spelling practice from Flux: drills from your own word list read aloud, homophones like their, there and they’re, and punctuation practice. Works offline, saved on your device.">
<meta name="theme-color" content="#14060a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<!--
  Flux Spell: a free Flux tool, built like periodic.html — no bundles, no
  Supabase, no sign-in, nothing fetched, so it opens offline on any school
  computer. Shared parts: public/js/flux-tool-kit.js, public/css/flux-tools.css.
  Not a Suite app of its own since 2026-11-18: it opens inside the app it
  fits (public/js/flux-tool-embed.js says which), and still works on its own.
-->
<link rel="stylesheet" href="public/css/flux-hub.css?v=d76c413f">
<link rel="stylesheet" href="public/css/flux-standalone-dark.css?v=806aa2b8">
<link rel="stylesheet" href="public/css/flux-tools.css?v=3c01335d">
<style>
  :root { --bg: #14060a; --accent: #fda4af; }
</style>
<script src="public/js/flux-theme-carry.js?v=c2d84cfb"></script>
<script src="public/js/flux-purple-day.js?v=b8cd878a"></script>
<link rel="stylesheet" href="public/css/flux-look-flat.css?v=8156dbe3">
</head>
<body>
  <a href="#main" class="skip-link">Skip to the spelling drills</a>
  <header class="top">
    <a class="ft-back" href="suite.html" aria-label="Back to Flux Suite" title="Back to Flux Suite"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <img class="brand-mark" src="public/flux-planner-logo.png" alt="" width="28" height="28">
    <span class="title">Flux Spell</span>
    <span class="grow"></span>
    <div data-flux-hub="spell"></div>
  </header>
  <main id="main" tabindex="-1">

    <h1 class="ft-h1">Spell</h1>
    <p class="ft-lede">Practise your own words, the homophones everyone mixes up, and punctuation.</p>
    <div class="ft-tabs" role="tablist" aria-label="Spelling drills"><button type="button" role="tab" class="ft-tab" id="tab-words" aria-controls="pane-words">My words</button><button type="button" role="tab" class="ft-tab" id="tab-homo" aria-controls="pane-homo">Homophones</button><button type="button" role="tab" class="ft-tab" id="tab-punc" aria-controls="pane-punc">Punctuation</button></div>
    <section class="ft-card" id="pane-words" role="tabpanel" aria-labelledby="tab-words">
      <label class="ft-field">Your words, one per line or separated by commas<textarea id="spList" class="ft-in" rows="4" style="min-height:96px">necessary
separate
definitely
rhythm
accommodate</textarea></label>
      <div class="ft-row"><button type="button" class="ft-btn primary" id="spStart">Start the drill</button><label class="ft-check"><input type="checkbox" id="spShuffle" checked> Shuffle</label></div>
      <div id="spDrill" hidden>
        <p class="ft-big" id="spPrompt"></p>
        <div class="ft-row"><button type="button" class="ft-btn" id="spSay">Say it again</button><button type="button" class="ft-btn" id="spHint">Show a hint</button></div>
        <form id="spForm" class="ft-row" novalidate>
          <label class="ft-field">Type the word<input id="spAns" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
          <button type="submit" class="ft-btn primary">Check</button>
        </form>
        <div class="ft-out" id="spOut" aria-live="polite"></div>
      </div>
    </section>
    <section class="ft-card" id="pane-homo" role="tabpanel" aria-labelledby="tab-homo">
      <p class="ft-big" id="hoQ"></p>
      <div class="ft-row" id="hoOpts" role="group" aria-label="Choose the word"></div>
      <div class="ft-out" id="hoOut" aria-live="polite"></div>
      <button type="button" class="ft-btn" id="hoNext" style="margin-top:10px">Next</button>
    </section>
    <section class="ft-card" id="pane-punc" role="tabpanel" aria-labelledby="tab-punc">
      <p>Which is punctuated correctly?</p>
      <div id="puOpts" class="ft-list" role="group" aria-label="Choose a sentence"></div>
      <div class="ft-out" id="puOut" aria-live="polite"></div>
      <button type="button" class="ft-btn" id="puNext" style="margin-top:10px">Next</button>
    </section>
  </main>
  <script src="public/data/products.js?v=bebae07f"></script>
  <script src="public/js/flux-hub.js?v=eb42b549"></script>
  <script src="public/js/flux-suite-timer.js?v=998cda1e"></script>
  <script src="public/js/flux-tool-kit.js?v=91bafb05"></script>
  <script src="public/js/flux-app-spell.js?v=c780a3c9"></script>
</body>
</html>
