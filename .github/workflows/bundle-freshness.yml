name: Bundle freshness

# index.html ships 3 built bundles (public/bundles/*), not the per-file
# public/js/*.js scripts. This fails the build if someone edited public/js
# without running `npm run build:web`, so stale bundles can never merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bundles-fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify public/bundles is rebuilt from public/js
        run: node scripts/check-bundles-fresh.mjs
