name: Temporary one-shot bundle rebuild

on:
  push:
    branches:
      - fix/ti84-audit-safety

permissions:
  contents: write

jobs:
  rebuild:
    if: contains(github.event.head_commit.message, '[rebuild-bundles]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regenerate all versioned web bundles
        run: npm run build:web
      - name: Commit the generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Generated outputs are already current."
            exit 0
          fi
          git commit -m "chore: regenerate web bundles for calculator fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
