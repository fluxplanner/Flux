name: CodeQL

# Scans the browser code and the Supabase edge functions for security bugs
# (injection, unsafe redirects, leaked data paths). Findings appear under the
# repo's Security tab, which only people with write access can see.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1' # Mondays 06:23 UTC, catches new CodeQL rules

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths-ignore:
              - node_modules
              - public/bundles
              - dist
              - test-results
              - showcase

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
