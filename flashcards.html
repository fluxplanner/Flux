<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flux Flashcards</title>
<meta name="description" content="Free flashcards with no ads: spaced repetition that schedules every card for when you are about to forget it, flip cards, write, practice tests, a match game, AI cards from your notes, Quizlet import, share links and printing.">
<meta name="theme-color" content="#0c0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="public/flux-planner-logo.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Flux Flashcards">

<!--
  Flux Flashcards: decks, spaced repetition and five study modes on their own
  page, made the way composer.html is — no app bundles and no Supabase library,
  so it opens on any school computer without an account. Decks live in this
  browser; the planner carries them to the account when signed in.
-->
<link rel="stylesheet" href="public/css/flux-hub.css?v=e475386e">
<link rel="stylesheet" href="public/css/flux-flashcards.css?v=31c44298">
<style>
  :root { --bg: #0c0a14; --text: #eef1fb; --muted2: #a3acc6; --accent: #f472b6; --border: rgba(255,255,255,.08); --border2: rgba(255,255,255,.14); --card: rgba(22,22,36,.86); --card2: rgba(34,34,54,.9); }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background-color: #0c0a14; }
  body {
    min-height: 100dvh;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(244,114,182,.10), transparent 55%),
      radial-gradient(90% 70% at 100% 5%, rgba(124,92,255,.08), transparent 55%),
      linear-gradient(170deg, #0f0c1a 0%, #0c0a14 55%, #07060d 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 16px; line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  header.top {
    display: flex; align-items: center; gap: 10px;
    height: calc(52px + env(safe-area-inset-top, 0px));
    padding: env(safe-area-inset-top, 0px) max(clamp(8px, 1.6vw, 14px), env(safe-area-inset-right, 0px)) 0 max(clamp(8px, 1.6vw, 14px), env(safe-area-inset-left, 0px));
    border-bottom: 1px solid var(--border);
    background: #0e0b17;
    position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
  .brand-mark { width: 30px; height: 30px; border-radius: 9px; display: block; }
  .title { font-weight: 800; font-size: .95rem; letter-spacing: -.01em; white-space: nowrap; }
  .title small { font-weight: 600; color: var(--muted2); margin-left: 6px; }
  .grow { flex: 1; }
  main {
    padding: clamp(14px, 2.6vw, 28px) max(clamp(12px, 2.6vw, 28px), env(safe-area-inset-right, 0px)) calc(56px + env(safe-area-inset-bottom, 0px)) max(clamp(12px, 2.6vw, 28px), env(safe-area-inset-left, 0px));
  }
  @media (max-width: 560px) { .title small { display: none; } }
</style>
<script src="public/js/flux-theme-carry.js?v=be761bf0"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#/" aria-label="Flux Flashcards: all decks">
      <img class="brand-mark" src="public/flux-planner-logo.png" alt="" width="30" height="30">
      <span class="title">Flux Flashcards<small>Remember everything</small></span>
    </a>
    <span class="grow"></span>
    <div data-flux-hub="flashcards"></div>
  </header>
  <main id="ffHost" class="ff-app" aria-label="Flux Flashcards"></main>

  <!-- Plain script tags, not the app bundles: this page has to stand alone. -->
  <script src="public/js/flux-hub.js?v=fdafb8be"></script>
  <script src="public/js/flux-flash-core.js?v=4b8fcb32"></script>
  <script src="public/js/flux-flash-samples.js?v=ecf2071f"></script>
  <script src="public/js/flux-flashcards.js?v=760aaf3e"></script>
  <script>
    (function () {
      var host = document.getElementById('ffHost');
      if (!window.FluxFlash || !window.FluxFlashcards) {
        host.innerHTML = '<p style="padding:24px;color:#fbbf24">Flux Flashcards could not load. Try refreshing.</p>';
        return;
      }
      window.fluxFlashcardsPage = window.FluxFlashcards.mount(host);
    })();
  </script>
</body>
</html>
