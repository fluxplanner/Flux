<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flux — every app</title>
<meta name="description" content="Every Flux app in one place: the Flux Planner, Grapher, Periodic Table, Composer and Calculator. The tools are free and need no account.">
<meta name="theme-color" content="#070b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="public/flux-planner-logo.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Flux">

<!--
  The Flux hub: one page with every Flux app on it. Built like periodic.html —
  no bundles, no sign-in — and drawn from FluxHub.PRODUCTS in flux-hub.js, so
  a product added to the app switcher appears here too without editing this.
-->
<link rel="stylesheet" href="public/css/flux-hub.css?v=e475386e">
<style>
  :root { --bg: #070b14; --text: #eaf1ff; --muted2: #9fb0cc; --accent: #00c2ff; --border: rgba(255,255,255,.08); --border2: rgba(255,255,255,.15); --card: rgba(18,25,42,.78); }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background-color: #070b14; }
  body {
    min-height: 100dvh;
    background:
      radial-gradient(120% 70% at 50% -10%, rgba(0,194,255,.13), transparent 55%),
      radial-gradient(80% 60% at 100% 10%, rgba(167,139,250,.10), transparent 55%),
      linear-gradient(170deg, #0a0f1c 0%, #070b14 55%, #05070f 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    line-height: 1.5;
  }
  header.top {
    display: flex; align-items: center; gap: 10px;
    height: calc(56px + env(safe-area-inset-top, 0px));
    padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
    border-bottom: 1px solid var(--border); background: #080c16;
  }
  .brand-mark { width: 32px; height: 32px; border-radius: 9px; display: block; }
  .brand { font-weight: 800; font-size: 1.05rem; letter-spacing: -.01em; }
  main { max-width: 1120px; margin: 0 auto; padding: clamp(28px, 6vw, 64px) max(16px, env(safe-area-inset-right, 0px)) calc(56px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .hero { text-align: center; margin: 0 auto clamp(26px, 5vw, 44px); max-width: 640px; }
  .hero h1 { margin: 0 0 10px; font-size: clamp(2rem, 5.5vw, 3.2rem); font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
  .hero h1 span { background: linear-gradient(120deg, color-mix(in srgb, var(--accent) 50%, #fff), var(--accent) 45%, color-mix(in srgb, var(--accent) 60%, #a78bfa)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { margin: 0; color: var(--muted2); font-size: clamp(.98rem, 2vw, 1.1rem); }
  .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; }
  .app {
    --c1: #00c2ff; --c2: #5c9cff;
    position: relative; display: flex; flex-direction: column; gap: 14px;
    padding: 20px; border-radius: 20px; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--border);
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .app:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--c1) 55%, transparent); box-shadow: 0 18px 40px -22px var(--c1); }
  .app:focus-visible { outline: 2px solid var(--c1); outline-offset: 3px; }
  .app-top { display: flex; align-items: center; gap: 14px; }
  .app-icon { display: grid; place-items: center; flex: none; width: 54px; height: 54px; border-radius: 16px; color: #061020; background: linear-gradient(135deg, var(--c1), var(--c2)); box-shadow: 0 10px 24px -12px var(--c1); }
  .app-icon svg { width: 26px; height: 26px; }
  .app-name { font-size: 1.15rem; font-weight: 800; letter-spacing: -.01em; }
  .app-tag { font-size: .86rem; color: var(--muted2); }
  .app-desc { margin: 0; font-size: .92rem; line-height: 1.55; color: #cbd6ea; flex: 1; }
  .app-foot { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
  .go { font-size: .9rem; font-weight: 800; color: var(--c1); white-space: nowrap; }
  .app--planner { --c1: #00c2ff; --c2: #6a7dff; }
  .app--grapher { --c1: #6ee7b7; --c2: #00c2ff; }
  .app--periodic { --c1: #7fe3ff; --c2: #3b82f6; }
  .app--composer { --c1: #c4b5fd; --c2: #a78bfa; }
  .app--calculator { --c1: #fbbf24; --c2: #f97316; }
  .app--flashcards { --c1: #f9a8d4; --c2: #f472b6; }
  .app--pixel { --c1: #6ee7b7; --c2: #34d399; }
  .note { margin: 28px auto 0; text-align: center; font-size: .85rem; color: var(--muted2); }
  .note a { color: #7fe3ff; }
</style>
<script src="public/js/flux-theme-carry.js?v=be761bf0"></script>
</head>
<body>
  <header class="top">
    <img class="brand-mark" src="public/flux-planner-logo.png" alt="" width="32" height="32">
    <span class="brand">Flux</span>
  </header>
  <main>
    <section class="hero">
      <h1>Every Flux app, <span style="white-space:nowrap">one tap away.</span></h1>
      <p>The planner for your whole school life, and free study tools that open on any computer — no account needed.</p>
    </section>
    <div class="apps" id="apps" aria-label="Flux apps"></div>
    <p class="note">Bookmark this page, or add it to your home screen, to get to every Flux app.</p>
  </main>

  <script src="public/js/flux-hub.js?v=7fc9bdd6"></script>
  <script>
    (function () {
      /* A sentence each, longer than the switcher's one-line tagline. A
         product without one here still shows, with its tagline. */
      var MORE = {
        planner: 'Tasks, classes, your calendar and bell schedule, study tools, college prep and Canvas assignments in one calm place. Sign in to sync across your devices.',
        grapher: 'Graph equations, plot lab data, fit a line of best fit with R² and residuals, and print it for your write-up.',
        periodic: 'Every trend, the table melting and boiling with temperature, electron configurations, spectra, isotopes and every atom in 3D.',
        pixel: 'Draw science diagrams, maps and sketches with lab, circuit and maths stamps, labels with leader lines, and a crisp PNG for your notes or lab report.',
        flashcards: 'Decks that schedule every card for when you are about to forget it, plus flip cards, write, practice tests, a match game, AI cards from your notes and Quizlet import. No ads.',
        composer: 'A table of every key, a keyboard that writes what you play, scales, chords, cadences, an ear trainer, a beat maker and DP Music.',
        calculator: 'A calculator that works like the TI-84 Plus CE, with graphs, tables and statistics, in your browser.',
      };
      var esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };
      var host = document.getElementById('apps');
      var list = (window.FluxHub && window.FluxHub.PRODUCTS) || [];
      if (!list.length) {
        host.innerHTML = '<p style="color:#fbbf24">The app list could not load. <a href="index.html" style="color:#7fe3ff">Open the Flux Planner</a>.</p>';
        return;
      }
      host.innerHTML = list.map(function (p) {
        return '<a class="app app--' + esc(p.id) + '" href="' + esc(p.href) + '">'
          + '<div class="app-top"><span class="app-icon" aria-hidden="true">' + p.mark + '</span>'
          + '<div><div class="app-name">' + esc(p.name) + '</div><div class="app-tag">' + esc(p.tagline) + '</div></div></div>'
          + '<p class="app-desc">' + esc(MORE[p.id] || p.tagline) + '</p>'
          + '<div class="app-foot"><span class="go">Open →</span></div>'
          + '</a>';
      }).join('');
    })();
  </script>
</body>
</html>
