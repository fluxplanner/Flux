<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flux Periodic Table</title>
<meta name="description" content="A free interactive periodic table from Flux: every periodic trend, the table melting and boiling with temperature, electron configurations, line spectra and hydrogen's energy levels, mass spectra, and every atom in 3D. No account needed.">
<meta name="theme-color" content="#070b14">
<!-- On a phone's home screen these pages run full-screen like the planner:
     the page's own dark colour under the clock, not a white bar, and the
     header padded down clear of the notch (env(safe-area-inset-*) below). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="public/flux-planner-logo.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Flux Periodic">

<!--
  The standalone periodic table, made the way grapher.html is: no app
  bundles and no Supabase, only its own scripts, so it opens on any school
  computer without an account. The same tool is Study tools ▸ Chemistry ▸
  Table inside the planner.
-->
<link rel="stylesheet" href="public/css/flux-ptable.css?v=68e3b6b4">
<link rel="stylesheet" href="public/css/flux-hub.css?v=e475386e">
<style>
  :root {
    --bg: #070b14;
    --text: #eaf1ff;
    --muted2: #9fb0cc;
    --accent: #00c2ff;
    --border: rgba(255,255,255,.07);
    --border2: rgba(255,255,255,.14);
    --card: rgba(18,25,42,.78);
    --card2: rgba(28,36,58,.8);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  /* A solid colour behind everything, so no edge of the screen can show white. */
  html, body { background-color: #070b14; }
  body {
    min-height: 100dvh;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(0,194,255,.10), transparent 55%),
      radial-gradient(90% 70% at 100% 5%, rgba(124,92,255,.08), transparent 55%),
      linear-gradient(170deg, #0a0f1c 0%, #070b14 55%, #05070f 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  header.top {
    display: flex; align-items: center; gap: 10px;
    height: calc(52px + env(safe-area-inset-top, 0px));
    padding: env(safe-area-inset-top, 0px) max(clamp(8px, 1.6vw, 14px), env(safe-area-inset-right, 0px)) 0 max(clamp(8px, 1.6vw, 14px), env(safe-area-inset-left, 0px));
    border-bottom: 1px solid var(--border);
    /* Solid, not frosted glass. iPhone Safari carries the colour of a bar at
       the top up behind the clock; a see-through one it shows as a blur of
       whatever is scrolling underneath. */
    background: #080c16;
    position: sticky; top: 0; z-index: 20;
  }
  .brand-mark { width: 30px; height: 30px; border-radius: 9px; display: block; }
  .title { font-weight: 800; font-size: .95rem; letter-spacing: -.01em; white-space: nowrap; }
  .grow { flex: 1; }
  .hbtn {
    display: grid; place-items: center; width: 36px; height: 36px; padding: 0; margin: 0;
    border: 0; border-radius: 10px; background: none; color: var(--muted2); cursor: pointer;
  }
  .hbtn:hover { color: var(--text); background: rgba(255,255,255,.06); }
  .hbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  main {
    padding: clamp(12px, 2.4vw, 26px) max(clamp(10px, 2.4vw, 28px), env(safe-area-inset-right, 0px)) calc(48px + env(safe-area-inset-bottom, 0px)) max(clamp(10px, 2.4vw, 28px), env(safe-area-inset-left, 0px));
    max-width: 1680px; margin: 0 auto;
  }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 50;
    padding: 9px 14px; border-radius: 10px; font-size: .86rem; font-weight: 600;
    background: #10233a; color: #d7f3ff; border: 1px solid rgba(0,194,255,.35); box-shadow: 0 12px 30px -12px rgba(0,0,0,.6);
  }
  @media (max-width: 560px) { .title { display: none; } }

  /* Print options: colour or black-and-white elements, and a key. */
  .pwrap { position: relative; display: inline-flex; }
  .pmenu {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 40; width: 250px; padding: 12px;
    border-radius: 14px; background: #121a2c; border: 1px solid var(--border2);
    box-shadow: 0 18px 48px -12px rgba(0,0,0,.7);
  }
  .pmenu[hidden] { display: none; }
  .pmenu-h { margin: 0 0 8px; font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted2); }
  .pmenu-seg { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; margin-bottom: 10px; border-radius: 10px; background: rgba(255,255,255,.04); border: 1px solid var(--border); }
  .pmenu-seg button {
    appearance: none; border: 0; margin: 0; padding: 7px 6px; border-radius: 8px; cursor: pointer;
    font: inherit; font-size: .8rem; font-weight: 700; color: var(--muted2); background: transparent;
  }
  .pmenu-seg button[aria-checked="true"] { color: #062030; background: linear-gradient(135deg, #7fe3ff, #00c2ff); }
  .pmenu-row { display: flex; align-items: flex-start; gap: 9px; padding: 4px 2px 12px; cursor: pointer; font-size: .84rem; }
  .pmenu-row input { margin: 3px 0 0; accent-color: #00c2ff; width: 16px; height: 16px; }
  .pmenu-row b { display: block; }
  .pmenu-row small { display: block; color: var(--muted2); font-size: .74rem; line-height: 1.35; }
  .pmenu-row.is-off { opacity: .45; cursor: default; }
  .pmenu-note { margin: -4px 2px 10px; font-size: .74rem; line-height: 1.4; color: var(--muted2); }
  .pmenu-go {
    width: 100%; padding: 9px; border: 0; border-radius: 10px; cursor: pointer;
    font: inherit; font-size: .86rem; font-weight: 800; color: #062030; background: linear-gradient(135deg, #7fe3ff, #00c2ff);
  }
  /* Only on paper: the Flux mark, top left. */
  .print-mark { display: none; }
  /* No page margin, so the browser has nowhere to print its own header and
     footer (the date and time, the address); the body pads the page instead. */
  @page { margin: 0; }
  @media print {
    header.top, .toast { display: none; }
    /* min-height: 100dvh is the *screen's* height, and Safari keeps it when
       printing: on a landscape page that ran the body onto a second, empty
       sheet. On paper the body is as tall as the table, no taller. */
    html, body { min-height: 0 !important; height: auto !important; background: #fff !important; }
    body { color: #000; padding: 9mm 11mm; }
    main { padding: 0; max-width: none; }
    .print-mark {
      display: flex; align-items: center; gap: 6px; margin: 0 0 6px;
      font-size: 10px; font-weight: 700; letter-spacing: .01em; color: #333;
    }
    /* The mark is drawn for a dark background; on paper it sits on its app tile. */
    .print-mark img {
      width: 20px; height: 20px; padding: 2px; border-radius: 5px; background: #0b0f1a;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
  }
</style>
<script src="public/js/flux-theme-carry.js?v=be761bf0"></script>
</head>
<body>
  <header class="top">
    <img class="brand-mark" src="public/flux-planner-logo.png" alt="Flux" width="30" height="30">
    <span class="title">Periodic Table</span>
    <span class="grow"></span>
    <button type="button" class="hbtn" id="ptShare" title="Copy a link to what you are looking at" aria-label="Share">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
    </button>
    <span class="pwrap">
    <button type="button" class="hbtn" id="ptPrint" title="Print the table" aria-label="Print" aria-haspopup="dialog" aria-expanded="false" aria-controls="ptPrintMenu">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V2h12v7"/><rect x="6" y="14" width="12" height="8" rx="1"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/></svg>
    </button>
    <div class="pmenu" id="ptPrintMenu" role="dialog" aria-label="Print options" hidden>
      <div class="pmenu-h">Print</div>
      <div class="pmenu-seg" role="radiogroup" aria-label="Elements">
        <button type="button" role="radio" data-ink="colour" aria-checked="true">Colour</button>
        <button type="button" role="radio" data-ink="bw" aria-checked="false">Black &amp; white</button>
      </div>
      <label class="pmenu-row"><input type="checkbox" id="ptPrintKey"><span><b>Colour key</b><small>Names what each colour means, above the transition metals</small></span></label>
      <button type="button" class="pmenu-go" id="ptPrintGo">Print</button>
    </div>
    </span>
    <div data-flux-hub="periodic"></div>
  </header>

  <div class="print-mark" aria-hidden="true"><img src="public/flux-planner-logo.png" alt="" width="20" height="20"><span>Flux Periodic Table</span></div>
  <main id="ptHost" aria-label="Periodic table"></main>

  <!-- Plain script tags, not the app bundles: this page has to stand alone. -->
  <script src="public/js/flux-hub.js?v=0ca09fdb"></script>
  <script src="public/js/flux-periodic.js?v=a33c798e"></script>
  <script src="public/js/flux-ptable-data.js?v=8af848a3"></script>
  <script src="public/js/flux-chem.js?v=07de6a14"></script>
  <script src="public/js/flux-ptable.js?v=aee8d3a2"></script>
  <script src="public/js/flux-ptable-atom3d.js?v=6ebfd2ec"></script>
  <script src="public/js/flux-ptable-explore.js?v=e77e1b21"></script>
  <script>
    (function () {
      var host = document.getElementById('ptHost');
      if (!window.FluxPTable) {
        host.innerHTML = '<p style="padding:24px;color:#fbbf24">The periodic table could not load. Try refreshing.</p>';
        return;
      }
      var app = window.FluxPTable.mount(host, { hash: true, surface: 'standalone' });
      var toast = function (text) {
        var t = document.createElement('div');
        t.className = 'toast';
        t.textContent = text;
        document.body.appendChild(t);
        setTimeout(function () { t.remove(); }, 2200);
      };
      document.getElementById('ptShare').addEventListener('click', function () {
        var url = location.href;
        if (navigator.share && window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
          navigator.share({ title: 'Flux Periodic Table', url: url }).catch(function () {});
          return;
        }
        try { navigator.clipboard.writeText(url).then(function () { toast('Link copied'); }, function () { window.prompt('Copy this link:', url); }); }
        catch (e) { window.prompt('Copy this link:', url); }
      });
      /* Print: a small menu first — colour or black-and-white elements, and
         whether a key names the colours. Remembered for next time, and used
         for the browser's own Print too (beforeprint). */
      var PRINT_PREFS = 'flux_ptable_print';
      var pBtn = document.getElementById('ptPrint');
      var pMenu = document.getElementById('ptPrintMenu');
      var pKey = document.getElementById('ptPrintKey');
      function printPrefs() {
        var p = {};
        try { p = JSON.parse(localStorage.getItem(PRINT_PREFS) || '{}') || {}; } catch (e) { /* private window */ }
        return { ink: p.ink === 'bw' ? 'bw' : 'colour', key: !!p.key };
      }
      function setPrintPrefs(p) {
        try { localStorage.setItem(PRINT_PREFS, JSON.stringify(p)); } catch (e) { /* private window */ }
        syncPrintMenu();
        prepareShare();
      }
      /* A home-screen app on an iPhone or iPad cannot print at all, so there
         the table goes to the Share sheet as an image, which has Print in it.
         The image is drawn while the menu is open: Safari only opens the sheet
         straight from the tap, not after a wait. */
      var viaShare = !!(window.FluxHub && FluxHub.canPrint && !FluxHub.canPrint());
      var shareImg = null, shareMaking = null;
      function prepareShare() {
        if (!viaShare || !app || !app.printImage) return;
        shareImg = null;
        shareMaking = app.printImage(printPrefs()).then(function (b) { shareImg = b; return b; }, function () { return null; });
      }
      if (viaShare) {
        var note = document.createElement('p');
        note.className = 'pmenu-note';
        note.innerHTML = 'On your phone this opens the Share menu: choose <b>Print</b> there.';
        pMenu.insertBefore(note, document.getElementById('ptPrintGo'));
      }
      function syncPrintMenu() {
        var p = printPrefs();
        pMenu.querySelectorAll('[data-ink]').forEach(function (b) { b.setAttribute('aria-checked', String(b.dataset.ink === p.ink)); });
        pKey.checked = p.key && p.ink !== 'bw';
        pKey.disabled = p.ink === 'bw';
        pKey.closest('.pmenu-row').classList.toggle('is-off', p.ink === 'bw');
      }
      function onPrintOutside(e) { if (!pMenu.contains(e.target) && e.target !== pBtn && !pBtn.contains(e.target)) closePrintMenu(); }
      function onPrintKey(e) { if (e.key === 'Escape') { closePrintMenu(); pBtn.focus(); } }
      function openPrintMenu() {
        syncPrintMenu();
        prepareShare();
        pMenu.hidden = false;
        pBtn.setAttribute('aria-expanded', 'true');
        document.addEventListener('click', onPrintOutside, true);
        document.addEventListener('keydown', onPrintKey, true);
      }
      function closePrintMenu() {
        pMenu.hidden = true;
        pBtn.setAttribute('aria-expanded', 'false');
        document.removeEventListener('click', onPrintOutside, true);
        document.removeEventListener('keydown', onPrintKey, true);
      }
      pBtn.addEventListener('click', function () { if (pMenu.hidden) openPrintMenu(); else closePrintMenu(); });
      pMenu.addEventListener('click', function (e) {
        var ink = e.target.closest('[data-ink]');
        if (ink) { var p = printPrefs(); p.ink = ink.dataset.ink; setPrintPrefs(p); }
      });
      pKey.addEventListener('change', function () { var p = printPrefs(); p.key = pKey.checked; setPrintPrefs(p); });
      document.getElementById('ptPrintGo').addEventListener('click', function () {
        closePrintMenu();
        if (viaShare) {
          var send = function (blob) {
            if (!blob) { toast('Could not make the page to print.'); return; }
            FluxHub.printImage(blob, 'periodic-table.png', 'Flux Periodic Table').then(function (r) {
              if (r === 'saved') toast('Saved as an image. Open it and use Share, then Print.');
            });
          };
          if (shareImg) send(shareImg);
          else if (shareMaking) shareMaking.then(send);
          return;
        }
        if (app) app.setPrint(printPrefs());
        window.print();
      });
      window.addEventListener('beforeprint', function () { if (app) app.setPrint(printPrefs()); });
      window.addEventListener('hashchange', function () {
        if (!app) return;
        app.readHash();
        app.refresh();
      });
      window.fluxPeriodicPage = { get instance() { return app; } };
    })();
  </script>
</body>
</html>
