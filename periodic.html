<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flux Periodic Table</title>
<meta name="description" content="A free interactive periodic table from Flux: every periodic trend, the table melting and boiling with temperature, electron configurations, line spectra and hydrogen's energy levels, mass spectra, and every atom in 3D. No account needed.">
<meta name="theme-color" content="#070b14">
<link rel="icon" type="image/png" href="public/flux-planner-logo.png">

<!--
  The standalone periodic table, made the way grapher.html is: no app
  bundles and no Supabase, only its own scripts, so it opens on any school
  computer without an account. The same tool is Study tools ▸ Chemistry ▸
  Table inside the planner.
-->
<link rel="stylesheet" href="public/css/flux-ptable.css?v=efcd1e84">
<link rel="stylesheet" href="public/css/flux-hub.css?v=6a625201">
<style>
  :root {
    --bg: #070b14;
    --text: #eaf1ff;
    --muted2: #9fb0cc;
    --accent: #00c2ff;
    --border: rgba(255,255,255,.07);
    --border2: rgba(255,255,255,.14);
    --card: rgba(18,25,42,.78);
    --card2: rgba(28,36,58,.8);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100dvh;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(0,194,255,.10), transparent 55%),
      radial-gradient(90% 70% at 100% 5%, rgba(124,92,255,.08), transparent 55%),
      linear-gradient(170deg, #0a0f1c 0%, #070b14 55%, #05070f 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  header.top {
    display: flex; align-items: center; gap: 10px;
    height: 52px; padding: 0 clamp(8px, 1.6vw, 14px);
    border-bottom: 1px solid var(--border);
    background: rgba(8, 12, 22, .78);
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    position: sticky; top: 0; z-index: 20;
  }
  .brand-mark { width: 30px; height: 30px; border-radius: 9px; display: block; }
  .title { font-weight: 800; font-size: .95rem; letter-spacing: -.01em; white-space: nowrap; }
  .grow { flex: 1; }
  .hbtn {
    display: grid; place-items: center; width: 36px; height: 36px; padding: 0; margin: 0;
    border: 0; border-radius: 10px; background: none; color: var(--muted2); cursor: pointer;
  }
  .hbtn:hover { color: var(--text); background: rgba(255,255,255,.06); }
  .hbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  main { padding: clamp(12px, 2.4vw, 26px) clamp(10px, 2.4vw, 28px) 48px; max-width: 1680px; margin: 0 auto; }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 50;
    padding: 9px 14px; border-radius: 10px; font-size: .86rem; font-weight: 600;
    background: #10233a; color: #d7f3ff; border: 1px solid rgba(0,194,255,.35); box-shadow: 0 12px 30px -12px rgba(0,0,0,.6);
  }
  @media (max-width: 560px) { .title { display: none; } }
  @media print {
    header.top { display: none; }
    body { background: #fff; color: #000; }
    main { padding: 0; }
  }
</style>
</head>
<body>
  <header class="top">
    <img class="brand-mark" src="public/flux-planner-logo.png" alt="Flux" width="30" height="30">
    <span class="title">Periodic Table</span>
    <span class="grow"></span>
    <button type="button" class="hbtn" id="ptShare" title="Copy a link to what you are looking at" aria-label="Share">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
    </button>
    <button type="button" class="hbtn" id="ptPrint" title="Print the table" aria-label="Print">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V2h12v7"/><rect x="6" y="14" width="12" height="8" rx="1"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/></svg>
    </button>
    <div data-flux-hub="periodic"></div>
  </header>

  <main id="ptHost" aria-label="Periodic table"></main>

  <!-- Plain script tags, not the app bundles: this page has to stand alone. -->
  <script src="public/js/flux-hub.js?v=41c74ac1"></script>
  <script src="public/js/flux-periodic.js?v=a33c798e"></script>
  <script src="public/js/flux-ptable-data.js?v=8af848a3"></script>
  <script src="public/js/flux-chem.js?v=07de6a14"></script>
  <script src="public/js/flux-ptable.js?v=7c5de611"></script>
  <script src="public/js/flux-ptable-atom3d.js?v=6ebfd2ec"></script>
  <script src="public/js/flux-ptable-explore.js?v=fe38d196"></script>
  <script>
    (function () {
      var host = document.getElementById('ptHost');
      if (!window.FluxPTable) {
        host.innerHTML = '<p style="padding:24px;color:#fbbf24">The periodic table could not load. Try refreshing.</p>';
        return;
      }
      var app = window.FluxPTable.mount(host, { hash: true, surface: 'standalone' });
      var toast = function (text) {
        var t = document.createElement('div');
        t.className = 'toast';
        t.textContent = text;
        document.body.appendChild(t);
        setTimeout(function () { t.remove(); }, 2200);
      };
      document.getElementById('ptShare').addEventListener('click', function () {
        var url = location.href;
        if (navigator.share && window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
          navigator.share({ title: 'Flux Periodic Table', url: url }).catch(function () {});
          return;
        }
        try { navigator.clipboard.writeText(url).then(function () { toast('Link copied'); }, function () { window.prompt('Copy this link:', url); }); }
        catch (e) { window.prompt('Copy this link:', url); }
      });
      document.getElementById('ptPrint').addEventListener('click', function () { window.print(); });
      window.addEventListener('hashchange', function () {
        if (!app) return;
        app.readHash();
        app.refresh();
      });
      window.fluxPeriodicPage = { get instance() { return app; } };
    })();
  </script>
</body>
</html>
