<!--
  GitHub Pages can't send headers, so the CSP rides in a meta tag. A meta CSP
  ignores frame-ancestors; flux-frame-guard.js stays the clickjacking control.
  TODO(csp): 'unsafe-inline' stays until inline <script> blocks and on*= handlers
  move out — worst offenders are index.html (~386 on*= attributes) and the
  inline boot scripts on every standalone page.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https://fluxplanner.github.io; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.groq.com https://api.anthropic.com https://generativelanguage.googleapis.com https://api.openai.com; frame-src 'self'; form-action 'self'">
